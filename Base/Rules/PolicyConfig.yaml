# PolicyConfig.yaml - 策略组定义（按顺序生成）
#
# 使用方法：
# 1. policyname 下的键是生成后的策略组名称，顺序就是输出顺序。
#    RemoteRules.yaml 的 policyname（含 parenttag 继承值）须指向这里的组名；
#    DIRECT、REJECT、REJECT-DROP 是客户端内置策略，无需在这里定义。
# 2. 修改 Icon、Type、Proxies、Filter 等字段并重新生成，即可同步更新各平台配置和 Mihomo 转换 JS。
# 3. Proxies 中的 "$CountryGroups" 会展开为当前可用的国家/其他节点组。
#    当指定的国家组未出现时，优先使用 FallbackProxies；否则省略该国家组引用。
#    YAML 锚点用于复用列表，修改 &defaultProxies 可同步调整所有引用它的组。
# 4. 带 Country 的组由节点名称动态决定是否出现；Country: 其他 表示未匹配的节点。
#    国家组的 Filter 同时用于节点识别及各平台筛选。其他节点的
#    ExcludeFilter: "$CountryPatterns" 会从所有国家组的 Filter 自动组合。
# 5. LoonFilter 是 Loon [Remote Filter] 中的引用名；筛选表达式来自本组的
#    Filter 或 ExcludeFilter。SurgeOnly 和 PolicyPath 用于 Surge 的订阅组（默认名 Proxies）。
#
# 字段：Icon（必填图标 URL）、Type（select/url-test）、Proxies（引用组列表）、
# FallbackProxies（国家组缺席时的引用列表）、IncludeAll、Filter、ExcludeFilter、
# URL、Interval、Tolerance、Lazy、Country、LoonFilter、MihomoOnly、
# ExcludeDNSHijack、SurgeOnly、PolicyPath。
# NodeExcludePattern 用于跳过家宽等节点，也参与“其他节点”的分类。

NodeExcludePattern: '(?i)家宽|家庭|家庭宽带|商宽|商业宽带|星链|Starlink|落地'

policyname:
  选择代理:
    Icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png"
    Type: select
    Proxies: ["$CountryGroups", "手动选择", "DIRECT"]
  手动选择:
    Icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Round_Robin_1.png"
    Type: select
    IncludeAll: true
    LoonFilter: ALL_Filter
    ExcludeDNSHijack: true
  AI:
