  asn: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb"
tun:
  enable: false
  device: umihomo
  stack: mixed
  dns-hijack: ['any:53', 'tcp://any:53']
  udp-timeout: 300
  auto-route: true
  strict-route: true
  auto-redirect: false
  auto-detect-interface: true
profile:
  store-selected: true
  store-fake-ip: true
proxies:
  - {name: DNS_Hijack, type: dns}
# Normal Start From Here
dns:
