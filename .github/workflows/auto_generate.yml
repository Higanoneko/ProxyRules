name: Generate Config Files

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'Base/**'
      - 'program/**'
      - 'scripts/**'
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Download Loyalsoldier rules
        run: |
          mkdir -p /tmp/proxyrules-loyalsoldier
          for file in \
            reject.txt icloud.txt apple.txt google.txt \
            proxy.txt direct.txt private.txt gfw.txt \
            tld-not-cn.txt telegramcidr.txt cncidr.txt \
            lancidr.txt applications.txt; do
            curl --fail --location --retry 3 --connect-timeout 10 --max-time 120 \
              "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/$file" \
              --output "/tmp/proxyrules-loyalsoldier/$file"
          done

      - name: Validate upstream rules
        run: |
          python3 - <<'CHECK'
          from pathlib import Path

          limits = {
              "reject": 1,
              "icloud": 1,
              "apple": 1,
              "google": 1,
              "proxy": 10000,
              "direct": 50000,
              "private": 1,
              "gfw": 1,
              "tld-not-cn": 1,
              "telegramcidr": 5,
              "cncidr": 1,
              "lancidr": 1,
              "applications": 1,
          }

          for name, minimum in limits.items():
              path = Path(f"/tmp/proxyrules-loyalsoldier/{name}.txt")
              assert path.is_file(), f"Missing: {path}"

              lines = [
                  line.strip()
                  for line in path.read_text().splitlines()
                  if line.strip().startswith("- ")
              ]

              assert len(lines) >= minimum, (
                  f"{name}: only {len(lines)} rules, "
                  f"expected at least {minimum}"
              )

              print(f"OK {name}: {len(lines)} rules")
          CHECK

      - name: Convert Loyalsoldier rules
        working-directory: program
        run: |
          go run ./cmd/ruleconvert

      - name: Install Python dependencies
        run: python3 -m pip install --user PyYAML

      - name: Validate Loyalsoldier catalog
        run: python3 scripts/validate_loyalsoldier.py

      - name: Test generator
        working-directory: program
        run: |
          go test ./...

      - name: Generate configuration files
        working-directory: program
        run: |
          go run ./cmd/proxyrules --tool all

      - name: Check for changes
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain Config Wireguard_Easytier Rules)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in Config/Wireguard_Easytier directory"
            git status --short Config Wireguard_Easytier
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected in Config/Wireguard_Easytier directory"
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add Config/ Wireguard_Easytier/ Rules/

          BASE_COMMIT_MSG=$(git log -1 --pretty=format:"%s" -- Base/)
          git commit -m "Generator: $BASE_COMMIT_MSG" || exit 0
          git push

      - name: Generate summary
        if: always()
        run: |
          echo "## Configuration Files Generated ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Generated Files" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -d "Config" ]; then
            echo "#### Mihomo" >> $GITHUB_STEP_SUMMARY
            ls -lh Config/Mihomo/ 2>/dev/null | tail -n +2 | awk '{print "- " $9 " (" $5 ")"}' >> $GITHUB_STEP_SUMMARY || echo "- No files" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            echo "#### Stash" >> $GITHUB_STEP_SUMMARY
            ls -lh Config/Stash/ 2>/dev/null | tail -n +2 | awk '{print "- " $9 " (" $5 ")"}' >> $GITHUB_STEP_SUMMARY || echo "- No files" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            echo "#### Loon" >> $GITHUB_STEP_SUMMARY
            ls -lh Config/Loon/ 2>/dev/null | tail -n +2 | awk '{print "- " $9 " (" $5 ")"}' >> $GITHUB_STEP_SUMMARY || echo "- No files" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            echo "#### Surge" >> $GITHUB_STEP_SUMMARY
            ls -lh Config/Surge/ 2>/dev/null | tail -n +2 | awk '{print "- " $9 " (" $5 ")"}' >> $GITHUB_STEP_SUMMARY || echo "- No files" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            echo "#### Wireguard_Easytier / Mihomo" >> $GITHUB_STEP_SUMMARY
            ls -lh Wireguard_Easytier/Mihomo/mihomo_convert_*.js 2>/dev/null | awk '{print "- " $9 " (" $5 ")"}' >> $GITHUB_STEP_SUMMARY || echo "- No files" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            echo "#### Wireguard_Easytier / Surge" >> $GITHUB_STEP_SUMMARY
            ls -lh Wireguard_Easytier/Surge/Easytier.sgmodule 2>/dev/null | awk '{print "- " $9 " (" $5 ")"}' >> $GITHUB_STEP_SUMMARY || echo "- No files" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Config directory does not exist" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "Generated at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
