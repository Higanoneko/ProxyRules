name: Validate Pull Request

on:
  pull_request:
    branches:
      - main
    paths:
      - 'Base/**'
      - 'program/**'
      - 'scripts/**'
      - 'Rules/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate rules and generator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install PyYAML ruamel.yaml

      - name: Verify Egern rule sets
        run: python scripts/convert_egern.py --check

      - name: Test synchronization
        run: python scripts/test_sync_loyalsoldier.py

      - name: Check catalog synchronization
        run: python scripts/sync_loyalsoldier.py --check

      - name: Validate Loyalsoldier catalog
        run: python scripts/validate_loyalsoldier.py

      - name: Test Egern configuration generator
        run: python scripts/test_egern_config.py

      - name: Verify Egern configuration fragment
        run: python scripts/generate_egern_config.py --check

      - name: Test Go generator
        working-directory: program
        run: go test ./...

      - name: Generate all configurations
        working-directory: program
        run: go run ./cmd/proxyrules --tool all

      - name: Verify generated configurations
        run: |
          test -s Config/Stash/Stash_config_full.yaml
          test -s Config/Loon/Loon_config.lcf
          test -s Config/Surge/Surge_config.conf
          test -d Config/Mihomo
          find Config/Mihomo -maxdepth 1 -name '*.yaml' -type f | grep -q .
          echo "All client configuration directories verified"
